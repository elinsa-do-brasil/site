name: Build and publish Docker image

# Só dispara em tags de versão (ex.: v1.2.3) — cada release publica uma
# imagem "oficial" em vez de a cada push. Ver Dockerfile/docker-compose.yml
# para o que essa imagem contém (Next.js standalone + Payload, Node 24
# Alpine).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pacotes recém-publicados no GHCR nascem privados por padrão,
      # independente da visibilidade do repositório — não precisa de passo
      # extra pra isso. Ver:
      # https://docs.github.com/packages/working-with-a-github-packages-registry/working-with-the-container-registry
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # O secret DOTENV_PRODUCTION guarda um .env inteiro (multi-linha), não
      # um valor único — por isso vai como arquivo (`secret-files`), não
      # inline (`secrets:`). O input `secrets:` do build-push-action trata
      # cada linha como um par key=value separado; um valor multi-linha ali
      # quebra silenciosamente (só a 1ª linha vira o secret "dotenv", o
      # resto é interpretado como outros secrets soltos — daí os avisos
      # "*** is not a valid secret" e o SITE_DATABASE_URL "sumindo").
      - name: Write .env for build
        run: printf '%s' "${{ secrets.DOTENV_PRODUCTION }}" > .env.ci
        shell: bash

      # O Dockerfile monta esse arquivo como build secret (RUN --mount=
      # type=secret,id=dotenv,...) só pra inlinear as NEXT_PUBLIC_* e
      # satisfazer os `if (!x) throw` de módulo (CMS_DATABASE_URL/
      # SITE_DATABASE_URL) — o conteúdo nunca fica em nenhuma camada da
      # imagem. Requer o secret de repositório DOTENV_PRODUCTION (conteúdo
      # completo de um .env válido) configurado em Settings → Secrets and
      # variables → Actions.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            dotenv=.env.ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up build env file
        if: always()
        run: rm -f .env.ci
